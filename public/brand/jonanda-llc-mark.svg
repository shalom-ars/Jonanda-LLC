<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="JONANDA LLC Brand Mark">
  <defs>
    <linearGradient id="gold-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="gold-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="60%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Tech Hexagon (Subtle) -->
  <polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5" 
           stroke="url(#gold-grad-1)" stroke-width="2" stroke-opacity="0.35" fill="none" />
           
  <!-- Inner Dynamic Modern 'J' Prism Nodes -->
  <!-- Top bar of J / Tech convergence block -->
  <path d="M35 22 L68 22 C76 22 81 27 81 35 L81 40 L69 40 L69 34 C69 31 67 29 63 29 L35 29 Z" 
        fill="url(#gold-grad-1)" />

  <!-- Vertical Stem -->
  <path d="M57 32 L69 32 L69 64 C69 73 62 79 51 79 L36 79 C27 79 21 73 21 64 L21 58 L33 58 L33 63 C33 67 36 70 41 70 L49 70 C54 70 57 67 57 62 Z" 
        fill="url(#gold-grad-2)" />

  <!-- Center Geometric Quantum Core Accent -->
  <circle cx="50" cy="50" r="4.5" fill="url(#gold-light)" filter="url(#gold-glow)" />
  <circle cx="50" cy="50" r="2" fill="#FFFFFF" />

  <!-- Corner Tech Accents -->
  <circle cx="50" cy="5" r="2.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="89" cy="27.5" r="2.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="89" cy="72.5" r="2.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="50" cy="95" r="2.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="11" cy="72.5" r="2.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="11" cy="27.5" r="2.5" fill="#F59E0B" opacity="0.8" />
</svg>
